name: Build firmware & deploy web flasher

# Builds the ESP32-S3 firmware, merges it into a single binary, and publishes the
# browser web-flasher (web/flash/) to GitHub Pages so makers can flash from Chrome/Edge.
#
# One-time setup in the repo: Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queue competing deploys rather than killing the one already running. Two runs have
  # been cancelled here in practice, and now that pushes trigger builds automatically,
  # any two commits landing close together race for this group. Cancelling mid-deploy
  # can leave Pages serving the previous firmware while the repo says otherwise -- the
  # kind of mismatch nobody notices until a device fails to self-update.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO + esptool
        run: pip install platformio esptool

      - name: Build firmware
        run: pio run -e esp32-s3-amoled-175

      # The P4 target shares ui.cpp, radar_view.cpp, main.cpp and every data client with
      # the S3 build, so building it here catches a change that quietly breaks
      # portability in CI rather than on the bench.
      - name: Build the ESP32-P4 target
        run: pio run -e esp32-p4-lcd-4c

      - name: Stage the flashable images
        run: |
          B=.pio/build/esp32-s3-amoled-175
          BOOT_APP0="$(find "$HOME/.platformio/packages" -name boot_app0.bin -path '*framework-arduinoespressif32*' | head -1)"
          mkdir -p site
          cp web/flash/index.html web/flash/manifest.json site/
          # stamp the flasher page + manifest with the firmware version being built
          VER=$(grep -oE 'FW_VERSION "[0-9.]+"' src/config.h | grep -oE '[0-9.]+' | head -1)
          sed -i "s/__FWVER__/${VER:-dev}/g" site/index.html site/manifest.json

          # Publish the four images SEPARATELY rather than one merged blob.
          #
          # merge_bin emits a single contiguous image from 0x0 and pads the gaps between
          # segments with 0xFF. NVS lives at 0x9000-0xe000, right in the gap between the
          # partition table (0x8000) and boot_app0 (0xe000) - so flashing a merged image
          # silently wiped WiFi credentials and every setting even when the user did NOT
          # ask to erase. Listing the parts makes ESP Web Tools write only those regions
          # and leave NVS (and the LittleFS partition) alone.
          cp "$B/bootloader.bin" "$B/partitions.bin" "$B/firmware.bin" site/
          cp "$BOOT_APP0" site/boot_app0.bin

          # A merged image is still handy for esptool users and the release page, so keep
          # producing one - it is simply not what the browser flasher writes.
          python -m esptool --chip esp32s3 merge_bin -o site/SkyGlass-esp32s3.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0     "$B/bootloader.bin" \
            0x8000  "$B/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$B/firmware.bin"

          # The P4 goes through the same browser flasher: esptool-js and ESP Web Tools
          # both list ESP32-P4, and the manifest carries a second build so the page picks
          # the right one from whichever chip is plugged in. Note the bootloader offset
          # is 0x2000 on the P4, not 0x0 as on the S3 -- esptool's own esp32p4.py sets
          # BOOTLOADER_FLASH_OFFSET = 0x2000 because the first two sectors are reserved.
          # boot_app0 is shared: it is chip-independent and both boards use the same
          # partition layout.
          P=.pio/build/esp32-p4-lcd-4c
          cp "$P/bootloader.bin"  site/p4-bootloader.bin
          cp "$P/partitions.bin"  site/p4-partitions.bin
          cp "$P/firmware.bin"    site/p4-firmware.bin

          # ...and a plain application image for the device's own OTA page, which is how
          # you update a board that is already running rather than reflashing it.
          cp "$P/firmware.bin"    site/SkyGlass-esp32p4-firmware.bin

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
