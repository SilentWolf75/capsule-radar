name: Release firmware

# Push a tag like v1.0.0 to build the merged firmware and attach it to a GitHub
# Release (a single .bin makers can flash with esptool or the web flasher):
#   git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO + esptool
        run: pip install platformio esptool

      - name: Build firmware
        run: |
          pio run -e esp32-s3-amoled-175
          pio run -e esp32-p4-lcd-4c

      - name: Merge into single flashable binaries
        run: |
          BOOT_APP0="$(find "$HOME/.platformio/packages" -name boot_app0.bin -path '*framework-arduinoespressif32*' | head -1)"

          B=.pio/build/esp32-s3-amoled-175
          python -m esptool --chip esp32s3 merge_bin -o SkyGlass-esp32s3.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0     "$B/bootloader.bin" \
            0x8000  "$B/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$B/firmware.bin"
          cp "$B/firmware.bin" SkyGlass-ota.bin      # app-only image for the web OTA page

          # The P4's bootloader lives at 0x2000, not 0x0 -- esptool's own esp32p4.py sets
          # BOOTLOADER_FLASH_OFFSET there because the first two sectors are reserved. The
          # merged file still starts at 0x0; merge_bin pads the gap.
          P=.pio/build/esp32-p4-lcd-4c
          python -m esptool --chip esp32p4 merge_bin -o SkyGlass-esp32p4.bin \
            --flash_mode dio --flash_freq 80m --flash_size 32MB \
            0x2000  "$P/bootloader.bin" \
            0x8000  "$P/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$P/firmware.bin"
          cp "$P/firmware.bin" SkyGlass-p4-ota.bin

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SkyGlass-esp32s3.bin
            SkyGlass-ota.bin
            SkyGlass-esp32p4.bin
            SkyGlass-p4-ota.bin
          generate_release_notes: true
          body: |
            Two boards, one firmware: **ESP32-S3-Touch-AMOLED-1.75** (466×466) and
            **ESP32-P4-WIFI6-Touch-LCD-4C** (720×720).

            **First flash (USB)** — the browser installer detects which board you have
            and writes the matching build: https://silentwolf75.github.io/skyglass/

            Or with esptool, using the merged image for your board:
            - S3: `esptool.py --chip esp32s3 write_flash 0x0 SkyGlass-esp32s3.bin`
            - P4: `esptool.py --chip esp32p4 write_flash 0x0 SkyGlass-esp32p4.bin`

            **Update over WiFi (no cable)** — the app-only image, uploaded on the
            device's own update page. Do **not** upload a merged image there.
            - S3: `SkyGlass-ota.bin` → `http://skyglass-s3.local/update`
            - P4: `SkyGlass-p4-ota.bin` → `http://skyglass-p4.local/update`
